<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050510" />
    <title>نوفا ماركت | دون اتصال</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; overflow: hidden; background: #050510; color: #e2e8f0; font-family: Tahoma, Arial, sans-serif; }
      main { width: min(460px, 100%); padding: 34px 28px; text-align: center; border: 1px solid rgba(0,240,255,.24); border-radius: 24px; background: rgba(255,255,255,.06); box-shadow: 0 0 60px rgba(0,240,255,.12); }
      .mark { width: 74px; height: 74px; margin: 0 auto 22px; border-radius: 22px; box-shadow: 0 0 30px rgba(0,240,255,.28); }
      h1 { margin: 0 0 12px; font-size: 27px; }
      p { margin: 0; color: #94a3b8; line-height: 1.9; }
      button { margin-top: 25px; min-height: 46px; padding: 0 20px; border: 0; border-radius: 13px; color: #031016; background: linear-gradient(100deg, #00f0ff, #a855f7); font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon-192.png" alt="شعار نوفا ماركت" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>يمكنك العودة عند استعادة الاتصال لمتابعة تصفح متجر نوفا ماركت.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
